title: Steak Knives and Bagels
author: Jonas Heinke
description: Jonas Heinke writes about roleplaying games, game design, and AI from Leipzig.
baseurl: ""
url: "https://www.allknivesnobagel.com"
# Keep local media until Jonas verifies every R2 object; activate in a second PR.
# Future value: https://media.allknivesnobagel.com (no trailing slash).
media_base: ""

# Collections
collections:
  blog:
    output: true
    permalink: /blog/:title/
  projects:
    output: true
  golden_triangle_parts:
    output: false
  for_want_of_fuel:
    output: true
    permalink: /for-want-of-fuel/:name/
  thoughts:
    output: true
    permalink: /thoughts/:title/

# Most _for_want_of_fuel files carry no layout in front matter — without this
# default they build as bare HTML fragments with no site chrome.
defaults:
  # jekyll-seo-tag reads page.image, so the site card is a front matter default.
  - scope:
      path: ""
    values:
      image: /assets/images/site-card.png
  # Canonical index URLs; redirects/ preserves the old .html addresses.
  - scope:
      path: "blog.md"
    values:
      permalink: /blog/
  - scope:
      path: "projects.md"
    values:
      permalink: /projects/
  - scope:
      type: for_want_of_fuel
    values:
      layout: for_want_of_fuel
  # Assets and repository reference pages stay out of the sitemap.
  - scope:
      path: "assets"
    values:
      sitemap: false
  - scope:
      path: "CLAUDE.md"
    values:
      sitemap: false
  - scope:
      path: "AGENTS-WELCOME.md"
    values:
      sitemap: false
  # Generated markdown siblings (scripts/llms_full.rb) are for agents, not the sitemap.
  - scope:
      path: "blog"
    values:
      sitemap: false
  - scope:
      path: "thoughts"
    values:
      sitemap: false
  - scope:
      path: "for-want-of-fuel"
    values:
      sitemap: false
  # Jekyll 4 copies front-matter-free .md siblings verbatim, including GEC1.
  # Unlinked GEC1 test preview (deploy-to-personal-site.mjs --vorschau): never in the sitemap.
  - scope:
      path: "teaching/gec1-vorschau"
    values:
      sitemap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-last-modified-at

# feed.xml combines Blog + Thoughts; jekyll-feed supplies feed_meta and skips
# generation when a source feed already exists at its configured path.
feed:
  path: "/feed.xml"

sass:
  sass_dir: assets/css
  style: compressed

exclude:
  - _site/
  - .jekyll-cache/
  - .sass-cache/
  - .bundle/
  - .env
  - .env.*
  - scripts/
  - docs/
  - task-dashboard/
  - vendor/
  - README.md
  - LICENSE
  - .gitignore
  - Gemfile
  - Gemfile.lock
